# Fitness Landscape Package

## Overview
This package is a Python library for analyzing fitness landscapes modeled as network graphs. It provides efficient implementations of Walsh-Hadamard transformations, graph Fourier transforms, and eigenmode decomposition, as well as various analysis methods for studying epistasis, ruggedness, and evolutionary paths.

## Installation
```
pip install landscapy
```

