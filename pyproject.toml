[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landscapy"
version = "0.9.0"
description = "Construction and analysis of graph-based fitness landscapes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Matthew A. Spence", email = "matthew.spence@anu.edu.au" },
  { name = "Barnabas Gall" },
  { name = "Dana S. Matthews" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.24",
  "pandas>=2.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17"]
cli = ["click>=8.1"]
knn = ["scikit-learn>=1.3"]
tda = ["gudhi>=3.11", "scikit-learn>=1.3"]
analysis = ["gudhi>=3.11", "scikit-learn>=1.3"]
faiss = ["faiss-cpu>=1.11", "scikit-learn>=1.3"]
parallel = ["ray>=2.48"]
alignment = ["softalign>=1.0.0"]
phylogeny = [
  "cogent3==2025.7.10a10",
  "piqtree>=0.6.1",
  "softalign>=1.0.0",
]
ml = [
  "torch>=2.1",
  "torch-geometric>=2.6",
  "transformers>=4.53.2",
]
embeddings = [
  "torch>=2.1",
  "transformers>=4.53.2",
]
all = [
  "click>=8.1",
  "cogent3==2025.7.10a10",
  "faiss-cpu>=1.11",
  "gudhi>=3.11",
  "piqtree>=0.6.1",
  "pyarrow>=17",
  "ray>=2.48",
  "scikit-learn>=1.3",
  "softalign>=1.0.0",
  "torch>=2.1",
  "torch-geometric>=2.6",
  "transformers>=4.53.2",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-mock>=3.14",
  "ruff>=0.5",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/RSCJacksonLab/landscapy"
Issues = "https://github.com/RSCJacksonLab/landscapy/issues"
Repository = "https://github.com/RSCJacksonLab/landscapy"

[project.scripts]
landscapy = "fitness_landscape.__main__:cli"
landscapy-evol = "fitness_landscape.__main__:evol_diffusion_landscape"
landscapy-phylo = "fitness_landscape.__main__:phylo_landscape"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
filterwarnings = [
  "ignore:numpy.core._multiarray_umath.*:DeprecationWarning",
  "ignore:.*SwigPyPacked.*:DeprecationWarning",
  "ignore:.*SwigPyObject.*:DeprecationWarning",
  "ignore:.*swigvarlink.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Release-blocking correctness rules. Broader style cleanup is intentionally
# separate from this gate so it cannot obscure executable failures.
select = ["F811", "F821", "F822"]

[tool.coverage.run]
branch = true
source = ["fitness_landscape"]

[tool.coverage.report]
fail_under = 56
precision = 1
show_missing = true
skip_covered = true
