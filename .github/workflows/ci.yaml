name: Python Package CI

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev] # Installs your package and dev dependencies
        pip install pytest-cov # Install coverage tool

    - name: Run tests and check coverage
      run: |
        # Run tests with coverage, and fail if coverage is below 95%
        pytest --cov=src/fitness_landscape --cov-fail-under=80